name: Env Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-env:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest python-dotenv

    - name: Run env tests
      env:
        HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        AVATAR_ID: Dexter_Lawyer_Sitting_public
        VOICE_ID: 1a32e06dde934e69ba2a98a71675dc16
        LANGUAGE: Spanish
      run: pytest tests/test_env.py
